services:
  emotion:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/emotion.db
      COOKIE_SECURE: "false"
      CORS_ORIGIN: http://localhost:5173
    volumes:
      - emotion-data:/app/data

volumes:
  emotion-data:
